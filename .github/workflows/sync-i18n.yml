name: sync i18n

# Re-runs infra/i18n/i18n_sync.py from SpikyMC: downloads every published
# translation from i18n.prismlauncher.org, verifies it, drops the languages
# below 90% translated and recompiles the SpikyMC overlay on top.
on:
  workflow_dispatch:
  schedule:
    # the slot the old self-hosted timer used
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: sync-i18n
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SpikyTeam/SpikyMC
          path: .spikymc
          sparse-checkout: infra/i18n

      - name: Install lconvert and lrelease
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qttools5-dev-tools

      - name: Sync
        env:
          I18N_DST_DIR: ${{ github.workspace }}/i18n
          I18N_WORK_DIR: ${{ github.workspace }}/../i18n-work
          I18N_OVERLAY_DIR: ${{ github.workspace }}/../i18n-overlay
          I18N_BASE_TS_DIR: ${{ github.workspace }}/.spikymc/infra/i18n
        run: |
          mkdir -p "$I18N_OVERLAY_DIR"
          # only the overlay files; base-<code>.ts are the input lconvert merges into
          find .spikymc/infra/i18n -maxdepth 1 -name '*.ts' ! -name 'base-*' -exec cp {} "$I18N_OVERLAY_DIR/" \;
          python3 .spikymc/infra/i18n/i18n_sync.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n
          git diff --cached --quiet && echo "translations unchanged" && exit 0
          git commit -m "i18n: refresh from i18n.prismlauncher.org"
          git push

      - name: Republish mc.spiky.team
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gh workflow run pages.yml --repo SpikyTeam/mc.spiky.team
